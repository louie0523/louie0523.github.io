<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데브로그 · 벨로</title>
  <meta name="description" content="벨로의 개발 일지 — Baldo Master 등 진행 중인 프로젝트의 작업 기록.">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" href="Image/profile.jpg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Silkscreen&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="devlogs">
  <header id="topbar" class="topbar"></header>

  <main class="wrap">
    <header class="page-head">
      <p class="px-label">Patch Notes</p>
      <h1>개발 일지</h1>
      <p>진행 중인 프로젝트의 작업 기록입니다. 총 <b id="logTotal"></b>개 중 <b id="logShown"></b>개 표시 중.</p>
    </header>

    <div class="log-layout">
      <aside class="log-side">
        <div class="side-group">
          <input class="search" id="logSearch" type="search" placeholder="로그 검색 (예: 증강, 보스)" aria-label="로그 검색">
        </div>
        <div class="side-group">
          <h3 class="px-label">Project</h3>
          <div class="side-list" id="projList"></div>
        </div>
        <div class="side-group">
          <h3 class="px-label">Tag</h3>
          <div class="side-tags" id="tagList"></div>
        </div>
        <div class="side-group">
          <h3 class="px-label">Order</h3>
          <div class="sort" id="sortBox"></div>
        </div>
      </aside>

      <div>
        <div id="projInfo"></div>
        <div id="timeline"></div>
      </div>
    </div>
  </main>

  <footer id="footer" class="footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
